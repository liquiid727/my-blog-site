site_name: Liquiid Journey
site_description: AI 工程、后端系统与长期写作的公开笔记。
site_author: Liquiid
site_url: https://liquiid727.github.io/my-blog-site/
repo_name: liquiid727/my-blog-site
repo_url: https://github.com/liquiid727/my-blog-site
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  favicon: assets/images/favicon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换日间模式
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换夜间模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

extra_css:
  - assets/stylesheets/brand.css

extra:
  giscus:
    repo: liquiid727/my-blog-site
    repo_id: R_kgDORmv0DA
    category: General
    category_id: DIC_kwDORmv0DM4C6l2B

nav:
  - 首页: index.md
  - 项目: projects.md
  - 关于: about.md
  - 文章:
      - 博客时间线: blog/index.md
      - 架构: architecture/index.md
      - 后端: backend/index.md
      - 工程流程: devops/index.md
      - 随笔 / 杂谈: essays/index.md
      - 生活: life/index.md
      - 津津有味: 津津有味/index.md
      - 标签: tags/index.md
      - 归档: archive/index.md

plugins:
  - search
  - rss:
      match_path: "^(backend|architecture|devops|essays|life|津津有味)/.*\\.md$"
      date_from_meta:
        as_creation: date
      abstract_chars_count: 180

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: ignore
