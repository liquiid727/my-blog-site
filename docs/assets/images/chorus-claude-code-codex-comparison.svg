<svg width="1600" height="1080" viewBox="0 0 1600 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1080" fill="#F5EFE2"/>
  <rect x="52" y="48" width="1496" height="984" rx="36" fill="#FFFDFC" stroke="#1F2937" stroke-width="4"/>

  <text x="92" y="120" fill="#111827" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="700">
    Chorus / Claude Code / Codex 对比图
  </text>
  <text x="92" y="164" fill="#6B7280" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="24">
    一个更像 AI 协作流程平台，两个更像执行型 Coding Agent
  </text>

  <rect x="92" y="210" width="1416" height="760" rx="28" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="3"/>

  <rect x="92" y="210" width="1416" height="86" rx="28" fill="#F97316"/>
  <rect x="92" y="268" width="1416" height="28" fill="#F97316"/>

  <line x1="360" y1="210" x2="360" y2="970" stroke="#D1D5DB" stroke-width="3"/>
  <line x1="746" y1="210" x2="746" y2="970" stroke="#D1D5DB" stroke-width="3"/>
  <line x1="1127" y1="210" x2="1127" y2="970" stroke="#D1D5DB" stroke-width="3"/>

  <line x1="92" y1="296" x2="1508" y2="296" stroke="#D1D5DB" stroke-width="3"/>
  <line x1="92" y1="404" x2="1508" y2="404" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="92" y1="512" x2="1508" y2="512" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="92" y1="620" x2="1508" y2="620" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="92" y1="728" x2="1508" y2="728" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="92" y1="836" x2="1508" y2="836" stroke="#E5E7EB" stroke-width="2"/>

  <text x="120" y="264" fill="#FFFFFF" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">
    维度
  </text>
  <text x="486" y="264" text-anchor="middle" fill="#FFFFFF" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">
    Chorus
  </text>
  <text x="936" y="264" text-anchor="middle" fill="#FFFFFF" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">
    Claude Code
  </text>
  <text x="1317" y="264" text-anchor="middle" fill="#FFFFFF" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">
    Codex
  </text>

  <g fill="#111827" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="600">
    <text x="120" y="360">产品定位</text>
    <text x="120" y="468">主要管理对象</text>
    <text x="120" y="576">更像什么</text>
    <text x="120" y="684">擅长做什么</text>
    <text x="120" y="792">多人 / 多 Agent 协作</text>
    <text x="120" y="900">权限 / 审批 / 流程</text>
  </g>

  <g fill="#1F2937" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="24">
    <text x="388" y="350">AI 协作流程平台</text>
    <text x="388" y="384">管理 proposal、task、session、review</text>

    <text x="388" y="458">项目对象与协作流程</text>
    <text x="388" y="492">不只是单次对话或单次代码生成</text>

    <text x="388" y="566">像 AI 团队的调度台</text>
    <text x="388" y="600">重点是组织“AI + 人”怎么协作</text>

    <text x="388" y="674">任务拆解、状态流转、审核边界</text>
    <text x="388" y="708">多角色、多步骤项目协作</text>

    <text x="388" y="782">强调这件事</text>
    <text x="388" y="816">它本来就在解决多 Agent 协作问题</text>

    <text x="388" y="890">强调这件事</text>
    <text x="388" y="924">是它和普通 coding assistant 的关键差异</text>
  </g>

  <g fill="#1F2937" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="24">
    <text x="774" y="350">执行型 Coding Agent</text>
    <text x="774" y="384">围绕当前代码任务直接下场干活</text>

    <text x="774" y="458">代码、命令、当前工作区</text>
    <text x="774" y="492">更接近“一个 AI 工人”</text>

    <text x="774" y="566">像会读项目、会改代码的同事</text>
    <text x="774" y="600">重点是把眼前任务做完</text>

    <text x="774" y="674">读代码、改代码、跑命令、修问题</text>
    <text x="774" y="708">和开发者并肩处理当前工程任务</text>

    <text x="774" y="782">不是主设计目标</text>
    <text x="774" y="816">更偏单 Agent 直接执行</text>

    <text x="774" y="890">不是核心卖点</text>
    <text x="774" y="924">重点仍然是执行，不是治理流程</text>
  </g>

  <g fill="#1F2937" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="24">
    <text x="1155" y="350">执行型 Coding Agent</text>
    <text x="1155" y="384">围绕当前代码任务直接下场干活</text>

    <text x="1155" y="458">代码、命令、当前工作区</text>
    <text x="1155" y="492">更接近“一个 AI 工人”</text>

    <text x="1155" y="566">像会读项目、会改代码的同事</text>
    <text x="1155" y="600">重点是把眼前任务做完</text>

    <text x="1155" y="674">读代码、改代码、跑命令、修问题</text>
    <text x="1155" y="708">和开发者并肩处理当前工程任务</text>

    <text x="1155" y="782">不是主设计目标</text>
    <text x="1155" y="816">更偏单 Agent 直接执行</text>

    <text x="1155" y="890">不是核心卖点</text>
    <text x="1155" y="924">重点仍然是执行，不是治理流程</text>
  </g>

  <rect x="92" y="990" width="1416" height="20" rx="10" fill="#FED7AA"/>
</svg>
